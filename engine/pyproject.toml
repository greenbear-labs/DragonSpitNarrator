[project]
name = "narrator-engine"
version = "0.1.0"
description = "Dragon Spit Narrator engine: HTTP API that routes narration requests to local TTS model workers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.8",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
narrator-engine = "narrator_engine.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrator_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
